name: Profile Cards

on:
  schedule:
    - cron: "41 1 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-cards.yml
  workflow_dispatch:

permissions:
  contents: write

# Serialise every job that pushes to main so they never race.
concurrency:
  group: profile-writes
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3D contribution skyline -> profile-3d-contrib/*.svg
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit 3D contribution graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          git diff --cached --quiet || git commit -m "chore: refresh 3D contribution graph"
          git pull --rebase origin main
          git push

      # Stats, languages and commit cards -> profile-summary-card-output/tokyonight/*.svg
      # (the action commits and pushes these itself)
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          THEME: tokyonight
          ANIMATION: stagger
