<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Harish V — Unity Game Developer, Gameplay Programmer, AI Systems Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04060f"/>
      <stop offset="0.55" stop-color="#0a1030"/>
      <stop offset="1" stop-color="#1a0b3a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="0.5" stop-color="#6c8cff"/>
      <stop offset="1" stop-color="#c77dff"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#c77dff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00bfff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00bfff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6c8cff" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace; }
    @keyframes spin   { to { transform: rotate(360deg); } }
    @keyframes spinR  { to { transform: rotate(-360deg); } }
    @keyframes drift  { from { transform: translateY(0); } to { transform: translateY(40px); } }
    @keyframes rise   { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes blink  { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes pulse  { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    @keyframes scan   { from { transform: translateY(-20px); } to { transform: translateY(340px); } }
    @keyframes float  { 0%,100% { transform: translateY(0); opacity: .2; } 50% { transform: translateY(-14px); opacity: .9; } }
    .grid   { animation: drift 6s linear infinite; }
    .ring1  { transform-origin: 1000px 160px; animation: spin 18s linear infinite; }
    .ring2  { transform-origin: 1000px 160px; animation: spinR 12s linear infinite; }
    .ring3  { transform-origin: 1000px 160px; animation: spin 30s linear infinite; }
    .t1 { animation: rise .9s .1s ease-out both; }
    .t2 { animation: rise .9s .35s ease-out both; }
    .t3 { animation: rise .9s .6s ease-out both; }
    .t4 { animation: rise .9s .85s ease-out both; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .scan   { animation: scan 5s linear infinite; }
    .dot    { animation: pulse 1.6s ease-in-out infinite; }
    .p { animation: float 4s ease-in-out infinite; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <g class="grid"><rect y="-40" width="1200" height="400" fill="url(#grid)"/></g>
    <circle cx="1000" cy="160" r="230" fill="url(#glow)"/>
    <rect class="scan" x="0" y="0" width="1200" height="3" fill="#00e5ff" opacity="0.18"/>

    <!-- floating particles -->
    <g fill="#00e5ff">
      <circle class="p" cx="640" cy="60"  r="2"   style="animation-delay:0s"/>
      <circle class="p" cx="720" cy="250" r="1.6" style="animation-delay:.8s"/>
      <circle class="p" cx="560" cy="275" r="2"   style="animation-delay:1.6s"/>
      <circle class="p" cx="790" cy="45"  r="1.6" style="animation-delay:2.2s"/>
      <circle class="p" cx="60"  cy="40"  r="1.8" style="animation-delay:1.1s"/>
      <circle class="p" cx="1150" cy="285" r="2"  style="animation-delay:.4s"/>
    </g>

    <!-- the "arc": rotating reactor rings -->
    <g fill="none" stroke-linecap="round">
      <g class="ring3"><circle cx="1000" cy="160" r="135" stroke="#6c8cff" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="2 10"/></g>
      <g class="ring1"><circle cx="1000" cy="160" r="112" stroke="url(#arcGrad)" stroke-width="6" stroke-dasharray="190 514" filter="url(#soft)" opacity="0.8"/>
                       <circle cx="1000" cy="160" r="112" stroke="url(#arcGrad)" stroke-width="3" stroke-dasharray="190 514"/></g>
      <g class="ring2"><circle cx="1000" cy="160" r="88" stroke="#c77dff" stroke-width="3" stroke-dasharray="90 463"/>
                       <circle cx="1000" cy="160" r="88" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="4 14"/></g>
    </g>
    <polygon points="1000,118 1036,139 1036,181 1000,202 964,181 964,139" fill="#0a1030" stroke="url(#arcGrad)" stroke-width="2.5"/>
    <text x="1000" y="172" text-anchor="middle" class="sans" font-size="34" font-weight="800" fill="url(#neon)">ZA</text>

    <!-- left: title block -->
    <g class="mono t1" font-size="13" fill="#00e5ff" letter-spacing="3">
      <circle class="dot" cx="74" cy="56" r="4" fill="#00e5ff"/>
      <text x="90" y="61">PLAYER ONE  //  ONLINE</text>
    </g>
    <text class="sans t2" x="70" y="140" font-size="78" font-weight="800" letter-spacing="4" fill="url(#neon)">HARISH V</text>
    <text class="sans t3" x="72" y="184" font-size="23" font-weight="600" fill="#e8ecff" letter-spacing="1">Unity Game Developer  •  Gameplay Programmer</text>
    <text class="mono t4" x="72" y="222" font-size="15" fill="#8fa3ff" letter-spacing="1">AI Systems Engineer · Procedural Worlds · Full-Stack<tspan class="cursor" fill="#00e5ff"> ▌</tspan></text>

    <!-- accent rule -->
    <rect x="72" y="246" width="210" height="3" rx="1.5" fill="url(#neon)"/>
    <rect x="290" y="246" width="40" height="3" rx="1.5" fill="#6c8cff" opacity="0.5"/>
    <rect x="338" y="246" width="14" height="3" rx="1.5" fill="#c77dff" opacity="0.5"/>

    <!-- border -->
    <rect x="1" y="1" width="1198" height="318" rx="18" fill="none" stroke="url(#neon)" stroke-opacity="0.45" stroke-width="2"/>
  </g>

</svg>
